name: Repository CI

on:
  pull_request:
    branches:
      - dev
      - uat
      - main
  push:
    branches:
      - dev
      - uat
      - main
      - feature/google-login

jobs:
  validate-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          set -e
          test -s README.md
          test -s google-login.txt
          echo "Repository validation passed"

      - name: Validate Git whitespace
        run: git diff --check

  identify-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Show environment
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in
            dev) echo "Target: DEV" ;;
            uat) echo "Target: UAT" ;;
            main) echo "Target: PRODUCTION" ;;
            *) echo "Target: FEATURE" ;;
          esac
