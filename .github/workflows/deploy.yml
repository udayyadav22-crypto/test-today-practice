name: Repository CI

on:
  pull_request:
    branches:
      - dev
      - uat
      - main

  push:
    branches:
      - dev
      - uat
      - main
      - feature/google-login
      - feature/dockerhub-push

permissions:
  contents: read

jobs:
  validate-repository:
    name: Validate and Test Python App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate required files
        run: |
          set -e
          test -s README.md
          test -s google-login.txt
          test -s app/main.py
          test -s tests/test_app.py
          test -s Dockerfile
          echo "Repository validation passed"

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t devops-practice-app:ci .

      - name: Validate Git whitespace
        run: git diff --check

  identify-branch:
    name: Identify Environment
    runs-on: ubuntu-latest

    steps:
      - name: Show environment
        run: |
          echo "Branch: $GITHUB_REF_NAME"

          case "$GITHUB_REF_NAME" in
            dev)
              echo "Target: DEV"
              ;;
            uat)
              echo "Target: UAT"
              ;;
            main)
              echo "Target: PRODUCTION"
              ;;
            *)
              echo "Target: FEATURE"
              ;;
          esac

  publish-dockerhub:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    needs:
      - validate-repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-practice-app:2.0
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-practice-app:latest




  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: validate-repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
